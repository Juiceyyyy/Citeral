name: Refresh local parser lockfile

on:
  push:
    branches: [feat/instant-local-attachments]
    paths:
      - ".github/workflows/refresh-local-parser-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/instant-local-attachments
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: lock local document parser dependencies"
          git push origin HEAD:feat/instant-local-attachments
