name: Encrypted database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/backup.yml"
      - ".github/backup-public-key.asc"
      - ".github/backup-key-fingerprint.txt"

permissions:
  contents: read

concurrency:
  group: citeral-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_RECIPIENT_FPR: "28FB5DFF2F126CEF2802E8BA4D4D1B870FDD43F7"

    steps:
      - uses: actions/checkout@v7

      - name: Check backup configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::DATABASE_URL is not configured; no recoverable production backup can be created."
            exit 1
          fi

          expected="$(tr -d '[:space:]' < .github/backup-key-fingerprint.txt)"
          if [[ "$expected" != "$BACKUP_RECIPIENT_FPR" ]]; then
            echo "::error::Backup public-key fingerprint mismatch."
            exit 1
          fi

      - name: Create compressed logical backup with PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD:/backup" \
            postgres:17-alpine \
            sh -c 'pg_dump --format=custom --compress=9 --no-owner --no-acl --file=/backup/citeral.dump "$DATABASE_URL"'

          test -s citeral.dump

      - name: Validate backup archive with PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/backup:ro" \
            postgres:17-alpine \
            pg_restore --list /backup/citeral.dump > restore.list

          test -s restore.list
          grep -Eq "TABLE DATA public profiles([[:space:]]|$)" restore.list
          grep -Eq "TABLE DATA public documents([[:space:]]|$)" restore.list
          echo "Logical backup archive is readable and contains core Citeral table data."

      - name: Verify backup recipient key
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/citeral-backup-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          gpg --batch --import .github/backup-public-key.asc

          imported="$(gpg --batch --with-colons --fingerprint "$BACKUP_RECIPIENT_FPR" | awk -F: '$1=="fpr"{print $10; exit}')"
          if [[ "$imported" != "$BACKUP_RECIPIENT_FPR" ]]; then
            echo "::error::Imported backup key fingerprint did not match the pinned recovery fingerprint."
            exit 1
          fi

      - name: Encrypt backup to offline recovery key
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/citeral-backup-gnupg"

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          name="citeral-${stamp}.dump.gpg"

          gpg \
            --batch \
            --yes \
            --trust-model always \
            --recipient "$BACKUP_RECIPIENT_FPR" \
            --output "$name" \
            --encrypt \
            citeral.dump

          test -s "$name"
          gpg --batch --list-only --list-packets "$name" >/dev/null
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          rm -f citeral.dump restore.list

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v7
        with:
          name: citeral-db-backup-${{ github.run_id }}
          path: |
            ${{ steps.encrypt.outputs.name }}
            ${{ steps.encrypt.outputs.name }}.sha256
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

      - name: Remove plaintext material
        if: always()
        shell: bash
        run: |
          rm -f citeral.dump restore.list
          rm -rf "$RUNNER_TEMP/citeral-backup-gnupg"
