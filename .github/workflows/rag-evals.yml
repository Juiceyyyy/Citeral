name: RAG release gates
# Workflow-file changes intentionally retrigger this release gate.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "apps/web/src/lib/bots/presets.ts"
      - "apps/web/src/lib/bots/system-prompt.ts"
      - "apps/web/src/lib/rag/**"
      - ".github/workflows/rag-evals.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: citeral-rag-release-gates
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_MODEL: "@cf/zai-org/glm-4.7-flash"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check free model configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Workers AI credentials are not configured; model-scored release gates cannot run."
          fi

      - name: Validate eval fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path("evals/sample.jsonl"), Path("evals/release-gates.jsonl")]
          count = 0
          for path in paths:
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  item = json.loads(line)
                  required = {"id", "bot_type", "question"}
                  missing = sorted(required - item.keys())
                  if missing:
                      raise SystemExit(f"{path}:{number}: missing {missing}")
                  count += 1
          print(f"Validated {count} eval fixtures")
          PY

      - name: Run model-scored release gates
        if: steps.config.outputs.ready == 'true'
        run: python evals/run_release_gates.py --output eval-results.json

      - name: Summarize release gates
        if: always() && steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -f eval-results.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("eval-results.json").read_text())
          print("### RAG release gates")
          print()
          print(f"- Model: `{r['model']}`")
          print(f"- Score: **{r['passed']}/{r['total']} ({r['score']:.0%})**")
          print(f"- Safety-critical failures: {', '.join(r['safety_failures']) if r['safety_failures'] else 'none'}")
          print()
          print("| Case | Result | Judge |")
          print("| --- | --- | --- |")
          for item in r["results"]:
              result="PASS" if item.get("pass") else "FAIL"
              reason=item.get("judge_reason") or item.get("error") or ""
              reason=str(reason).replace("|","\\|").replace("\n"," ")[:180]
              print(f"| {item['id']} | {result} | {reason} |")
          PY
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.config.outputs.ready == 'true'
        with:
          name: rag-release-gate-results
          path: eval-results.json
          if-no-files-found: ignore
          retention-days: 14
