name: Free RAG worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "knowledge/manifests/**"
      - "apps/worker/**"
      - ".github/workflows/free-worker.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: citeral-free-rag-worker
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      clamav:
        image: clamav/clamav:1.5.4
        ports:
          - 3310:3310
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_EMBEDDING_MODEL: "@cf/baai/bge-m3"
      EMBEDDING_DIMENSIONS: "1024"
      WORKER_BATCH_SIZE: "8"
      WORKER_ONESHOT: "true"
      WORKER_JOB_TYPES: "source_refresh"
      MALWARE_SCAN_REQUIRED: "true"
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      MAX_SOURCE_BYTES: "52428800"

    steps:
      - name: Check free-tier worker configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$DATABASE_URL" && -n "$SUPABASE_URL" && -n "$SUPABASE_SERVICE_ROLE_KEY" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            if [[ "$DATABASE_URL" == *"db."*".supabase.co"* ]]; then
              echo "DATABASE_URL points to Supabase's direct database host. GitHub-hosted runners may not have IPv6 reachability. Use the Supabase Session Pooler URI instead." >&2
              exit 1
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Worker secrets are not configured yet; skipping without any paid fallback."
          fi

      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-python@v7
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/worker/pyproject.toml

      - name: Install worker
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        run: |
          python -m pip install --upgrade pip
          pip install . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Register curated knowledge manifests
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        shell: bash
        run: |
          for manifest in ../../knowledge/manifests/*.json; do
            if [[ "$(basename "$manifest")" == "example-jurisdiction.json" ]]; then
              continue
            fi
            grounded-import-manifest "$manifest"
          done

      - name: Verify Workers AI embedding access
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          model = os.environ["CLOUDFLARE_EMBEDDING_MODEL"]
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/v1/embeddings"
          body = json.dumps({"model": model, "input": "Citeral worker health check"}).encode()
          req = urllib.request.Request(
              url,
              data=body,
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")[:1000]
              raise SystemExit(f"Workers AI health check failed ({exc.code}): {detail}")
          rows = payload.get("data", [])
          vector = rows[0].get("embedding") if rows and isinstance(rows[0], dict) else None
          if not isinstance(vector, list) or len(vector) != 1024:
              raise SystemExit(f"Workers AI returned unexpected embedding dimensions: {len(vector) if isinstance(vector, list) else 0}")
          print("Workers AI embedding access verified (1024 dimensions)")
          PY

      - name: Wait for ClamAV
        if: steps.config.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import socket, time
          for _ in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 3310), timeout=2):
                      print("ClamAV is ready")
                      raise SystemExit(0)
              except OSError:
                  time.sleep(2)
          raise SystemExit("ClamAV did not become ready")
          PY

      - name: Verify ClamAV signature freshness
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import socket
          import time
          from datetime import datetime, timezone

          def version():
              with socket.create_connection(("127.0.0.1", 3310), timeout=5) as sock:
                  sock.sendall(b"zVERSION\0")
                  data = bytearray()
                  while True:
                      chunk = sock.recv(4096)
                      if not chunk:
                          break
                      data.extend(chunk)
                      if b"\0" in chunk or b"\n" in chunk:
                          break
              return data.decode("utf-8", "replace").strip("\x00\r\n ")

          # The official container refreshes the database files with freshclam,
          # but its default Unix-socket notify path may not match the TCP clamd
          # used by GitHub Actions. Explicitly ask the running daemon to reload.
          with socket.create_connection(("127.0.0.1", 3310), timeout=5) as sock:
              sock.sendall(b"zRELOAD\0")
              reply = sock.recv(4096).decode("utf-8", "replace").strip("\x00\r\n ")
              print(f"ClamAV reload response: {reply}")

          last = ""
          for _ in range(24):
              last = version()
              parts = last.split("/", 2)
              if len(parts) == 3:
                  try:
                      db_time = datetime.strptime(parts[2], "%a %b %d %H:%M:%S %Y").replace(tzinfo=timezone.utc)
                  except ValueError:
                      db_time = None
                  if db_time is not None:
                      age = datetime.now(timezone.utc) - db_time
                      print(f"ClamAV loaded database age: {age.days} day(s) ({last})")
                      if age.total_seconds() <= 7 * 24 * 60 * 60:
                          raise SystemExit(0)
              time.sleep(5)

          raise SystemExit(f"ClamAV signatures are missing, unparsable or older than 7 days: {last}")
          PY

      - name: Refresh due authoritative sources
        id: refresh
        if: steps.config.outputs.ready == 'true'
        continue-on-error: true
        working-directory: apps/worker
        run: grounded-refresh-due

      - name: Process queued curated sources
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        run: grounded-worker

      - name: Clean abandoned transient uploads
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        run: python -m grounded_worker.cleanup_uploads

      - name: Report source refresh warnings
        if: steps.config.outputs.ready == 'true' && steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::One or more authoritative source refreshes were blocked or unavailable. Private queued-document ingestion completed successfully."
          {
            echo "### Authoritative source refresh warning"
            echo
            echo "One or more registered government sources could not be refreshed from this GitHub-hosted runner."
            echo "This does not block private document ingestion. Review the refresh-step logs for the affected official URLs."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check curated source health
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/worker
        shell: bash
        run: |
          set -o pipefail
          grounded-source-health | tee /tmp/citeral-source-health.md
          cat /tmp/citeral-source-health.md >> "$GITHUB_STEP_SUMMARY"
